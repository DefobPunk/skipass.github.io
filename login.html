<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Ски-Пассы</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <i class="fas fa-snowflake"></i> Ски-Пассы
            </div>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="about.html">О нас</a></li>
                <li><a href="tariffs.html">Тарифы</a></li>
                <li><a href="gallery.html">Галерея</a></li>
                <li><a href="contacts.html">Контакты</a></li>
                <li><a href="login.html" class="active">Вход</a></li>
            </ul>
        </nav>
    </header>
    
    <section class="login-section" style="padding: 4rem 2rem; max-width: 500px; margin: 2rem auto;">
        <div class="login-container" style="background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
            <h2 style="text-align: center; margin-bottom: 1.5rem; color: #0277bd;">Вход в систему</h2>
            
            <form id="login-form" style="display: grid; gap: 1.2rem;">
                <div style="display: flex; align-items: center; border: 1px solid #ddd; border-radius: 5px; padding: 0.5rem;">
                    <i class="fas fa-envelope" style="color: #0277bd; margin: 0 1rem;"></i>
                    <input type="email" placeholder="Ваш email" required style="flex: 1; border: none; padding: 0.8rem; outline: none;">
                </div>
                
                <div style="display: flex; align-items: center; border: 1px solid #ddd; border-radius: 5px; padding: 0.5rem;">
                    <i class="fas fa-lock" style="color: #0277bd; margin: 0 1rem;"></i>
                    <input type="password" placeholder="Пароль" required style="flex: 1; border: none; padding: 0.8rem; outline: none;">
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox">
                        <span>Запомнить меня</span>
                    </label>
                    <a href="#" style="color: #0277bd; text-decoration: none;">Забыли пароль?</a>
                </div>
                
                <button type="submit" style="background: #0277bd; color: white; border: none; padding: 1rem; border-radius: 5px; font-weight: 700; cursor: pointer; transition: background 0.3s;">
                    Войти
                </button>
                
                <div style="text-align: center; margin-top: 1rem;">
                    <p>Нет аккаунта? <a href="register.html" style="color: #ff5722; font-weight: 700;">Зарегистрироваться</a></p>
                </div>
            </form>
            
            <div style="text-align: center; margin-top: 2rem; color: #666;">
                <p>Или войдите через:</p>
                <div style="display: flex; justify-content: center; gap: 1rem; margin-top: 1rem;">
                    <button style="background: #3b5998; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 5px; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;">
                        <i class="fab fa-facebook"></i> Facebook
                    </button>
                    <button style="background: #4285f4; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 5px; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;">
                        <i class="fab fa-google"></i> Google
                    </button>
                </div>
            </div>
        </div>
    </section>
    
    <footer>
        <p>&copy; 2025 Ски-Пассы. Все права защищены. <i class="fas fa-heart"></i></p>
    </footer>
    
    <script src="script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const loginForm = document.getElementById("login-form");
            if (loginForm) {
                loginForm.addEventListener("submit", function(e) {
                    e.preventDefault();
                    const email = this.querySelector('input[type="email"]').value;
                    const password = this.querySelector('input[type="password"]').value;
                    
                    
                    console.log("Логин:", email, "Пароль:", password);
                    
                    alert("Вход выполнен успешно!");
                    this.reset();
                });
            }
        });
    </script>
</body>
</html>
